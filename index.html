<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>


</head>


<body class="d-flex flex-column justify-content-center align-items-center min-vw-45 min-vh-85 p-3 bg-warning">
  <div
    class="container flex-grow-1 border border-black border-2 border-right border-bottom rounded-4 bg-white shadow-sm p-4 w-25 "
    style="border-width: 2px 7px 7px 2px !important;">
    <div class="row">
      <img src="./assets/images/illustration-article.svg" alt="Illustration-article" class="rounded-4" />
    </div>
    <div class=" row py-1 px-2">

      <span class="col-auto fw-bold bg-warning rounded-2 px-2 text-break"> Learning</span>
    </div>
    <div class="row">
      <span class="col-auto text-black text-break"> Published 21 Dec 2023</span>
      <h5 class="col-auto fw-bold text-break">HTML & CSS foundations</h5>
      <div class=" row py-1"></div>
      <span class="col-auto text-muted text-break">These languages are the backbone of every website, defining
        structure, content, and
        presentation.
      </span>
    </div>
    <div class=" row d-flex align-items-center  py-2">
      <div class="col-auto"><img src="./assets/images/image-avatar.webp" alt="image-avatar" class="card author_image" />
      </div>
      <div class="col"><span class="fw-bold text-break">Greg Hooper</span></div>
    </div>

  </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Vaishali Mangla</a>.
  </footer>
</body>

</html>
